[package]
name = "support-update-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
time = { version = "=0.3.51", features = ["parsing"] }
