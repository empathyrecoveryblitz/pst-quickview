[package]
name = "pst-quickview"
version = "0.2.0-beta.3"
description = "Local-only read-only PST viewer"
authors = ["PST QuickView"]
license = "GPL-3.0-or-later"
repository = "https://github.com/empathyrecoveryblitz/pst-quickview"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pst_quickview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
mailparse = "0.15"
libc = "0.2"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
thiserror = "2"
time = "=0.3.51"
walkdir = "2"
ammonia = "4.0.2"
base64 = "0.22.1"
cfb = "=0.7.3"
msg_parser = "=0.3.6"
