name: App-only support development gate

on:
  push:
    branches: [codex/remote-support-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-development:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm audit
      - run: npm run test:frontend
      - run: npm run build
      - name: Independent update archive verifier gates
        run: |
          cargo fmt --manifest-path scripts/support-update-verifier/Cargo.toml --check
          cargo test --locked --manifest-path scripts/support-update-verifier/Cargo.toml
          cargo clippy --locked --manifest-path scripts/support-update-verifier/Cargo.toml --all-targets -- -D warnings
      - name: Native formatting
        run: |
          if cargo fmt --check; then exit 0; fi
          cargo fmt
          git diff --no-ext-diff -- '*.rs'
          exit 1
        working-directory: src-tauri
      - name: Native check
        run: cargo check --locked
        working-directory: src-tauri
      - name: Native Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Native tests
        run: cargo test --locked
        working-directory: src-tauri
      - run: scripts/agent-check.sh
      - run: PST_QUICKVIEW_SECURITY_STRESS=1 scripts/security-regression-gate.sh
      - run: bash scripts/test-macos-dylib-validation.sh
      - run: bash scripts/verify-macos-readpst-bundle.sh --source-only
      - run: scripts/audit-public-repo.sh
      - name: Build universal app only, without signing
        run: npm run tauri -- build --target universal-apple-darwin --bundles app --no-sign --ci
      - name: Inspect the exact current app; no stale-build fallback
        run: |
          package_status=0
          EXPECT_DMG=0 bash scripts/verify-macos-release.sh "src-tauri/target/universal-apple-darwin/release/bundle/macos/PST QuickView.app" || package_status=$?
          diagnostic_status=0
          python3 scripts/inspect-packaged-csp.py src-tauri/tauri.conf.json src-tauri/src/support_session.rs "src-tauri/target/universal-apple-darwin/release/bundle/macos/PST QuickView.app/Contents/MacOS/pst-quickview" || diagnostic_status=$?
          if ((package_status != 0 || diagnostic_status != 0)); then exit 1; fi
      - name: Archive app while preserving Mac executable modes and bundle structure
        run: |
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/PST QuickView.app" "$RUNNER_TEMP/PST-QuickView-support-development.zip"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/PST-QuickView.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "PST QuickView.app"
          shasum -a 256 "$RUNNER_TEMP/PST-QuickView-support-development.zip" "$RUNNER_TEMP/PST-QuickView.app.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: pst-quickview-support-development-unsigned
          path: |
            ${{ runner.temp }}/PST-QuickView-support-development.zip
            ${{ runner.temp }}/PST-QuickView.app.tar.gz
          if-no-files-found: error
          retention-days: 3
