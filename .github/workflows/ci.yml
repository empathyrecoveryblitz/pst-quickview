name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-16
        with: { toolchain: "1.88.0", components: rustfmt }
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: git diff --check
      - name: Shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: scripts/audit-public-repo.sh
      - run: scripts/agent-check.sh
