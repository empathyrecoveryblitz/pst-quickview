name: Unsigned universal release check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-16
        with:
          toolchain: "1.88.0"
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: npm ci
      - run: npm run tauri build -- --target universal-apple-darwin
      - run: EXPECT_DMG=1 bash scripts/verify-macos-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pst-quickview-unsigned-unnotarized
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
